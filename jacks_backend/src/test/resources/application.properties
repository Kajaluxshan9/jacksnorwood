# Test configuration: self-contained, so `mvn test` never touches the developer's
# real database or sends real email.

spring.profiles.active=test

# ─── In-memory database ─────────────────────────────────────────────────────
# PostgreSQL compatibility mode keeps the schema close to production.
# NON_KEYWORDS=KEY,VALUE is required because SiteSettings maps columns literally
# named "key" and "value", both of which H2 treats as reserved words.
spring.datasource.url=jdbc:h2:mem:jacks_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Surfaces lazy-loading mistakes in tests instead of hiding them behind the
# open-in-view session, which is not available outside a web request.
spring.jpa.open-in-view=false

# ─── Required app settings ──────────────────────────────────────────────────
app.admin.username=test-admin
app.admin.password=test-password
app.jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha256-signing
app.jwt.expiration=3600000
app.cors.allowed-origins=http://localhost:5173
app.upload.dir=${java.io.tmpdir}/jacks-test-uploads

# ─── Mail: no credentials, so nothing is ever actually sent ─────────────────
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=
spring.mail.password=
app.restaurant.email=

logging.level.com.jacksnorwood=WARN
