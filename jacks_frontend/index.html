<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Base meta — overridden per-page by react-helmet-async -->
    <title>Jack's Norwood | Pub &amp; Restaurant in Norwood, Ontario</title>
    <meta name="description" content="Jack's Norwood is your neighbourhood pub and restaurant in Norwood, Ontario. Great food, cold drinks, daily specials, and live events. Open 7 days a week." />
    <meta name="keywords" content="Jack's Norwood, pub, restaurant, Norwood Ontario, bar, Highway 7, food, drinks, events, live music" />
    <meta name="theme-color" content="#1a1208" />
    <meta name="robots" content="index,follow" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Jack's Norwood" />
    <meta name="apple-mobile-web-app-title" content="Jack's Norwood" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph base (react-helmet-async overrides per page) -->
    <meta property="og:site_name" content="Jack's Norwood" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:image" content="https://www.jacksnorwoodpub.ca/default-hero.jpeg" />

    <!-- Twitter Card base -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Performance: preconnect to font origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Open+Sans:wght@300;400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
