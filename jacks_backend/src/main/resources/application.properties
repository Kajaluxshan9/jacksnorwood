spring.application.name=jacks_backend
server.port=${SERVER_PORT:8080}

# ─── Profile (dev seeds DB, prod skips DataInitializer) ─────
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ─── Database ───────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jacksnorwood}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA ────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── Admin Seed Credentials (required — set via env vars) ───
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

# ─── JWT ────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ─── CORS ───────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ─── Mail ───────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Restaurant ─────────────────────────────────────────────
app.restaurant.email=${RESTAURANT_EMAIL:}

# ─── File Upload ────────────────────────────────────────────
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
app.upload.dir=${UPLOAD_DIR:uploads}

# ─── Logging ────────────────────────────────────────────────
logging.level.com.jacksnorwood=${LOG_LEVEL:INFO}
